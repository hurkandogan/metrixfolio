name: Deploy Frontend (metrixfolio-fe) on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-frontend:
    name: Deploy metrixfolio-fe to Firebase App Hosting
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (via WIF)
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/current'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy metrixfolio-fe to App Hosting
        run: |
          cd metrixfolio-fe
          firebase deploy --project=${{ secrets.GCP_PROJECT_ID }} --only apphosting:metrixfolio