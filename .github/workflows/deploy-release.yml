name: Deploy Frontend (metrixfolio-fe) on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-frontend:
    name: Deploy metrixfolio-fe to Firebase App Hosting
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (via WIF)
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Firebase App Hosting
        uses: 'google-github-actions/deploy-apphosting@v0'
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          backend_id: 'metrixfolio'
          
          working_dir: 'metrixfolio-fe'